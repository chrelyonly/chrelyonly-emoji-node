<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>头像生成表情包</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <style>
        body {
            background: #f7f9fa;
            font-family: "Helvetica Neue", sans-serif;
        }
        #app {
            max-width: 1000px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .preview img {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 20px;
        }
        .result img {
            margin-top: 30px;
            border: 2px solid #4CAF50;
        }
        .input-group {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .input-group > div {
            flex: 1;
        }
        .drag-circle {
            background-color: #78D2CC;
            border-radius: 50%;
            position: absolute;
            opacity: 0.5;
            cursor: move;
        }
    </style>
</head>
<body>
<div id="app">
    <el-card>
        <template #header>
            <h2 style="text-align: center;">简易抓 GIF 坐标的功能</h2>
            {{avatarPositions}}
        </template>

        <div style="margin-top: 40px;">
            <el-divider content-position="center">GIF工具</el-divider>

            <div style="text-align: center; margin-bottom: 20px;">
                <el-space direction="horizontal" alignment="center">
                    <el-select
                            v-model="selectedSource"
                            placeholder="请选择素材来源"
                            style="width: 200px"
                    >
                        <el-option label="左右猫猫图素材" value="gif2"></el-option>
                        <el-option label="雷劈猫猫图素材" value="gif3"></el-option>
                        <el-option label="急急猫猫图素材" value="gif4"></el-option>
                        <el-option label="摸头猫猫图素材" value="gif5"></el-option>
                        <el-option label="跳跳猫猫图素材" value="gif6"></el-option>
                        <el-option label="骑车猫猫图素材" value="gif7"></el-option>
                        <el-option label="猫猫艹图素材" value="gif10"></el-option>
                        <el-option label="床上导图素材" value="gif11"></el-option>
                        <el-option label="哆啦A梦导图素材" value="gif12"></el-option>
                    </el-select>

                    <el-button type="success" :loading="loadingBtn" @click="fetchHistory">
                        加载素材
                    </el-button>
                </el-space>
            </div>

            <div style="text-align: center;margin-top: 20px">
                <el-button type="success" :loading="loadingBtn" @click="copyAvatarPositions">
                    保存生成的坐标数组
                </el-button>
                <el-form-item label="头像大小XY">
                    <el-input-number
                            v-model="avatarWidth"
                            :min="50"
                            :max="600"
                            :step="10"
                            controls-position="right"
                            :precision="0"
                            style="width: 100%;"
                    />
                </el-form-item>
            </div>

            <div v-if="framesList.length" style="margin-top: 20px;">
                <el-row :gutter="20">
                    <el-col :span="12" v-for="(img, idx) in framesList" :key="idx">
                        <el-card :body-style="{ padding: '10px' }">
                            <div style="position:relative;">
                                <img :src="img.data" />

<!--                                多图-->
                                <div v-if="avatarPositions && avatarPositions[idx] instanceof Array">
                                    <div v-for="(avatarPositionInfo,index2) in avatarPositions[idx]" :key="index2">
                                        <!-- 拖拽圆圈 -->
                                        <div class="drag-circle"
                                             :style="{
                                    left: avatarPositionInfo[0] + 'px',
                                    top: avatarPositionInfo[1] + 'px',
                                    width: avatarPositionInfo[2] + 'px',
                                    height: avatarPositionInfo[2] + 'px'
                                }"
                                             @mousedown="startDrag2($event,idx, index2)"
                                        ></div>

                                        <!-- 控制按钮,可能存在多张图 -->
                                        <div style="margin-top: 10px; text-align: center;">
                                            <div v-if="avatarPositionInfo">
                                                <el-tag>X: {{avatarPositionInfo[0]}}</el-tag>
                                                <el-tag>Y: {{avatarPositionInfo[1]}}</el-tag>
                                                <el-tag>头像尺寸: {{avatarPositionInfo[2]}}</el-tag>
                                                <div>
                                                    <el-input-number v-model="avatarPositionInfo[0]" />
                                                </div>
                                                <div>
                                                    <el-input-number v-model="avatarPositionInfo[1]" />
                                                </div>
                                                <div>
                                                    <el-input-number v-model="avatarPositionInfo[2]" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
<!--                                单图-->
                                <div v-else>
                                    <!-- 拖拽圆圈 -->
                                    <div class="drag-circle"
                                         :style="{
                                        left: avatarPositions[idx][0] + 'px',
                                        top: avatarPositions[idx][1] + 'px',
                                        width: avatarPositions[idx][2] + 'px',
                                        height: avatarPositions[idx][2] + 'px'
                                    }"
                                         @mousedown="startDrag($event, idx)"
                                    ></div>

                                    <!-- 控制按钮 -->
                                    <div style="margin-top: 10px; text-align: center;">
                                        <el-button size="small" @click="moveLeft(idx)">左</el-button>
                                        <el-button size="small" @click="moveUp(idx)">上</el-button>
                                        <el-button size="small" @click="moveDown(idx)">下</el-button>
                                        <el-button size="small" @click="moveRight(idx)">右</el-button>
                                        <div v-if="avatarPositions[idx]">
                                            <el-tag>X: {{avatarPositions[idx][0]}}</el-tag>
                                            <el-tag>Y: {{avatarPositions[idx][1]}}</el-tag>
                                            <el-tag>头像尺寸: {{avatarPositions[idx][2]}}</el-tag>
                                            <div>
                                                <el-input-number v-model="avatarPositions[idx][0]" />
                                            </div>
                                            <div>
                                                <el-input-number v-model="avatarPositions[idx][1]" />
                                            </div>
                                            <div>
                                                <el-input-number v-model="avatarPositions[idx][2]" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </el-card>
                    </el-col>
                </el-row>
            </div>
        </div>
    </el-card>
</div>

<script src="https://unpkg.com/vue@3"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue"></script>

<script>
    const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

    const app = createApp({
        setup() {
            const framesList = ref([]);
            const avatarPositions = ref([]);
            const loadingBtn = ref(false);
            const selectedSource = ref("");
            const avatarWidth = ref(100);
            const dragSubIndex = ref(null);
            // 拖拽状态
            const dragging = ref(false);
            const dragIndex = ref(null);
            const offsetX = ref(0);
            const offsetY = ref(0);

            const startDrag = (e, idx) => {
                dragging.value = true;
                dragIndex.value = idx;
                dragSubIndex.value = null; // 单图
                offsetX.value = e.clientX - avatarPositions.value[idx][0];
                offsetY.value = e.clientY - avatarPositions.value[idx][1];
                e.preventDefault();
            };

            const startDrag2 = (e, idx, index2) => {
                dragging.value = true;
                dragIndex.value = idx;
                dragSubIndex.value = index2; // 记录多图的子索引
                offsetX.value = e.clientX - avatarPositions.value[idx][index2][0];
                offsetY.value = e.clientY - avatarPositions.value[idx][index2][1];
                e.preventDefault();
            };

            const onMouseMove = (e) => {
                if (dragging.value && dragIndex.value !== null) {
                    if (dragSubIndex.value === null) {
                        // 单图模式
                        avatarPositions.value[dragIndex.value][0] = e.clientX - offsetX.value;
                        avatarPositions.value[dragIndex.value][1] = e.clientY - offsetY.value;
                    } else {
                        // 多图模式
                        avatarPositions.value[dragIndex.value][dragSubIndex.value][0] = e.clientX - offsetX.value;
                        avatarPositions.value[dragIndex.value][dragSubIndex.value][1] = e.clientY - offsetY.value;
                    }
                }
            };

            const onMouseUp = () => {
                dragging.value = false;
                dragIndex.value = null;
                dragSubIndex.value = null;
            };

            onMounted(() => {
                window.addEventListener("mousemove", onMouseMove);
                window.addEventListener("mouseup", onMouseUp);
            });

            onBeforeUnmount(() => {
                window.removeEventListener("mousemove", onMouseMove);
                window.removeEventListener("mouseup", onMouseUp);
            });

            const moveLeft = (idx) => { avatarPositions.value[idx][0] -= 1; };
            const moveRight = (idx) => { avatarPositions.value[idx][0] += 1; };
            const moveUp = (idx) => { avatarPositions.value[idx][1] -= 1; };
            const moveDown = (idx) => { avatarPositions.value[idx][1] += 1; };

            const fetchHistory = () => {
                loadingBtn.value = true;
                axios.post('/emoji-app/emoji/images', {selectedSource: selectedSource.value})
                    .then(res => {
                        if (res.data.success) {
                            framesList.value = res.data.images;
                            avatarPositions.value = res.data.avatarPositions;
                        } else {
                            ElementPlus.ElMessage.warning('未获取到图片');
                        }
                    })
                    .catch(() => {
                        ElementPlus.ElMessage.error('请求失败');
                    })
                    .finally(() => {
                        loadingBtn.value = false;
                    });
            };

            const copyAvatarPositions = () => {
                const text = JSON.stringify(avatarPositions.value);
                navigator.clipboard.writeText(text)
                    .then(() => {
                        ElementPlus.ElMessage.success('位置数组已复制到剪贴板');
                    })
                    .catch(() => {
                        ElementPlus.ElMessage.error('复制失败，请手动复制');
                    });
            };

            return {
                framesList,
                avatarPositions,
                loadingBtn,
                selectedSource,
                avatarWidth,
                fetchHistory,
                copyAvatarPositions,
                moveLeft,
                moveRight,
                moveUp,
                moveDown,
                startDrag,
                startDrag2
            };
        }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component);
    }

    app.use(ElementPlus).mount('#app');
</script>
</body>
</html>
